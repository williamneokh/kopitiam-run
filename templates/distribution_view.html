<div class="space-y-3">
    <div class="text-sm text-gray-600 mb-4">
        👥 <strong>Distribution View</strong> - Track who gets what
    </div>
    {{if .Orders}}
        {{range .Orders}}
        <div class="bg-white border-2 border-gray-200 rounded-lg p-4 hover:border-amber-400 transition-colors cursor-pointer {{if .Delivered}}bg-gray-50 opacity-60{{end}}"
            hx-post="/room/{{$.RoomID}}/orders/{{.OrderID}}/toggle" 
            hx-target="#orders-container" hx-swap="innerHTML">
            <div class="flex items-center gap-4">
                <div class="text-2xl w-6 text-center">
                    {{if .Delivered}}✅{{else}}🏃‍♂️{{end}}
                </div>
                <div class="flex-1">
                    <div class="font-bold text-lg text-gray-800 {{if .Delivered}}line-through{{end}}">
                        {{.Nickname}}
                    </div>
                    <div class="text-gray-600 {{if .Delivered}}line-through{{end}}">
                        {{.DrinkName}}
                    </div>
                </div>
            </div>
        </div>
        {{end}}
    {{else}}
        <div class="text-center py-16">
            <div class="text-6xl mb-4">👥</div>
            <p class="text-xl text-gray-600">No orders yet</p>
            <p class="text-gray-500 mt-2">Orders will appear here when people submit them</p>
        </div>
    {{end}}
</div>
