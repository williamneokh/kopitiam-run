# fly.toml app configuration file for kopitiam-run
#
# See https://fly.io/docs/reference/configuration/ for more information.
#

app = "my-kopitiam-run" # Make sure this matches your app name on Fly.io
primary_region = "sin"

[build]

# The Go builder is usually detected automatically.
# Specifying it here is good practice but often not required.
# builder = "paketobuildpacks/builder:base"
# buildpacks = ["gcr.io/paketo-buildpacks/go"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0 # Set to 1 for an always-on app, 0 to scale to zero when idle.
  processes = ["app"]

# This health check points to the /health endpoint you created in main.go.
# Fly.io uses this to ensure your app is healthy before routing traffic to it.
[[http_service.checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "5s"
  method = "get"
  path = "/health"

# This section mounts the persistent volume we created into the /data directory.
[mounts]
  source = "data"
  destination = "/data"