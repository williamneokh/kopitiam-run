<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
    <title>Kopitiam Run</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-amber-50 to-orange-100 min-h-screen flex items-center justify-center">
    <div class="text-center max-w-lg mx-auto p-8">
        <div class="bg-white rounded-2xl shadow-2xl p-10">
            <h1 class="text-8xl mb-4">☕</h1>
            <h2 class="text-4xl font-bold text-amber-900 mb-2">Kopitiam Run</h2>
            <p class="text-gray-600 mb-8">Organize your team's coffee orders easily.</p>
            <button 
                hx-post="/room/create" 
                hx-swap="none"
                class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 px-6 rounded-xl text-xl shadow-lg transform transition hover:scale-105">
                🚀 Start a Kopitiam Run
            </button>
            <div class="mt-6 text-sm text-gray-500">
                <p>Click the button to create a new order room and get a shareable link.</p>
            </div>
        </div>
    </div>
</body>
</html>
